sdk-version: 3.5.2
name: pm-tests
source: daml
version: 0.1.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  - ../abu-pm-main/.daml/dist/abu-pm-main-0.5.2.dar
  - ../abu-pm-tickets/.daml/dist/abu-pm-tickets-0.1.4.dar
  - ../abu-pm-games/.daml/dist/abu-pm-games-0.1.2.dar
  - ../abu-pm-agents/.daml/dist/abu-pm-agents-0.2.2.dar
  - ../abu-pm-cc/.daml/dist/abu-pm-cc-0.1.1.dar
  # The token standard's own mock registry (Token, TokenRules) and the CIP-0056
  # V1 interfaces it carries, byte for byte (daml/vendor/splice/README.md).
  - ../vendor/splice/splice-api-token-metadata-v1-1.0.0.dar
  - ../vendor/splice/splice-api-token-holding-v1-1.0.0.dar
  - ../vendor/splice/splice-api-token-transfer-instruction-v1-1.0.0.dar
  - ../vendor/splice/splice-test-token-v1-1.0.1.dar
build-options:
  # Test-only registries (Test.CC.Registries) implement token-standard interfaces; this package is never uploaded.
  - -Wno-template-interface-depends-on-daml-script
