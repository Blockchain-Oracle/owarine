<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heading description" viewBox="0 0 1400 1010">
<title id="heading">Where a Canton print comes from</title><desc id="description">Three oracle parties read the named source; the resolver needs two that agree. Three rows of four connected stages. Node details and authority boundaries are available in the interactive documentation.</desc>
<defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#C23F1C"/></marker></defs>
<style>.background{fill:#F4EEE3}.node{fill:#FFFAF2;stroke:#D9D0C2;stroke-width:2}.heading,.title{font-family:Arial,sans-serif;fill:#211C18;font-weight:700}.heading{font-size:36px}.title{font-size:22px}.sub{font:16px Arial,sans-serif;fill:#6A625A}.num,.row{font:700 15px Arial,sans-serif;fill:#C23F1C}.arrow{stroke:#C23F1C;stroke-width:2.5}.arrow-label{font:12px Arial,sans-serif;fill:#6A625A}.footer{font:14px Arial,sans-serif;fill:#6A625A}</style>
<rect width="1400" height="1010" class="background"/>
<text x="32" y="66" class="heading">Where a Canton print comes from</text>
<text x="32" y="101" class="sub">Three oracle parties read the named source; the resolver needs two that agree.</text>
<path d="M32 123H1368" stroke="#D9D0C2" stroke-width="2"/>
<text x="32" y="183" class="row">01 · Crypto lanes</text><g><rect x="32" y="200" width="308" height="152" rx="15" class="node"/><text x="52" y="227" class="num">1.1</text><text class="title" x="52" y="266">Three exchanges</text><text class="sub" x="52" y="320">Coinbase, Kraken, Bitstamp</text></g><g><rect x="382" y="200" width="308" height="152" rx="15" class="node"/><text x="402" y="227" class="num">1.2</text><text class="title" x="402" y="266">Oracle feeders</text><text class="sub" x="402" y="320">Post at T + 10 s</text></g><g><rect x="732" y="200" width="308" height="152" rx="15" class="node"/><text x="752" y="227" class="num">1.3</text><text class="title" x="752" y="266">PriceQuote</text><text class="sub" x="752" y="320">Signed by one oracle</text></g><g><rect x="1082" y="200" width="308" height="152" rx="15" class="node"/><text x="1102" y="227" class="num">1.4</text><text class="title" x="1102" y="266">Quorum check</text><text class="sub" x="1102" y="320">2 of 3, spread within 1%</text></g><path d="M342 276h31" class="arrow" marker-end="url(#tip)"/><text x="355" y="379" class="arrow-label" text-anchor="middle">candle close</text><path d="M692 276h31" class="arrow" marker-end="url(#tip)"/><text x="705" y="379" class="arrow-label" text-anchor="middle">signed quote</text><path d="M1042 276h31" class="arrow" marker-end="url(#tip)"/><text x="1055" y="379" class="arrow-label" text-anchor="middle">evidence</text><text x="32" y="418" class="row">02 · Attested lanes</text><g><rect x="32" y="435" width="308" height="152" rx="15" class="node"/><text x="52" y="462" class="num">2.1</text><text class="title" x="52" y="501">Original source</text><text class="sub" x="52" y="555">Named on the Series policy</text></g><g><rect x="382" y="435" width="308" height="152" rx="15" class="node"/><text x="402" y="462" class="num">2.2</text><text class="title" x="402" y="501">Lane feeders</text><text class="sub" x="402" y="555">Each oracle reads it itself</text></g><g><rect x="732" y="435" width="308" height="152" rx="15" class="node"/><text x="752" y="462" class="num">2.3</text><text class="title" x="752" y="501">Attested PriceQuote</text><text class="sub" x="752" y="555">Same contract, same rules</text></g><g><rect x="1082" y="435" width="308" height="152" rx="15" class="node"/><text x="1102" y="462" class="num">2.4</text><text class="title" x="1102" y="501">Source on the receipt</text><text class="sub" x="1102" y="555">Every receipt names it</text></g><path d="M342 511h31" class="arrow" marker-end="url(#tip)"/><text x="355" y="614" class="arrow-label" text-anchor="middle">read at T</text><path d="M692 511h31" class="arrow" marker-end="url(#tip)"/><text x="705" y="614" class="arrow-label" text-anchor="middle">signed quote</text><path d="M1042 511h31" class="arrow" marker-end="url(#tip)"/><text x="1055" y="614" class="arrow-label" text-anchor="middle">named source</text><text x="32" y="653" class="row">03 · Resolution</text><g><rect x="32" y="670" width="308" height="152" rx="15" class="node"/><text x="52" y="697" class="num">3.1</text><text class="title" x="52" y="736">Opening print</text><text class="sub" x="52" y="790">Terms_RecordOpen</text></g><g><rect x="382" y="670" width="308" height="152" rx="15" class="node"/><text x="402" y="697" class="num">3.2</text><text class="title" x="402" y="736">Closing print</text><text class="sub" x="402" y="790">Admitted until its deadline</text></g><g><rect x="732" y="670" width="308" height="152" rx="15" class="node"/><text x="752" y="697" class="num">3.3</text><text class="title" x="752" y="736">Resolution</text><text class="sub" x="752" y="790">Up, Down or Void, once</text></g><g><rect x="1082" y="670" width="308" height="152" rx="15" class="node"/><text x="1102" y="697" class="num">3.4</text><text class="title" x="1102" y="736">Proof page</text><text class="sub" x="1102" y="790">Prints, hashes, re-verify</text></g><path d="M342 746h31" class="arrow" marker-end="url(#tip)"/><text x="355" y="849" class="arrow-label" text-anchor="middle">open recorded</text><path d="M692 746h31" class="arrow" marker-end="url(#tip)"/><text x="705" y="849" class="arrow-label" text-anchor="middle">close admitted</text><path d="M1042 746h31" class="arrow" marker-end="url(#tip)"/><text x="1055" y="849" class="arrow-label" text-anchor="middle">public read</text>
<path d="M32 920H1368" stroke="#D9D0C2" stroke-width="2"/>
<text x="32" y="951" class="footer">Owarine architecture · Source reviewed 30 September 2026 · Proven on a local Canton sandbox with demo credits; not yet on DevNet</text>
