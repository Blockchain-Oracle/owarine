<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heading description" viewBox="0 0 1400 1010">
<title id="heading">The desk on Canton</title><desc id="description">The owner sets the mandate; the operator chooses only when; the ledger checks every trade. Three rows of four connected stages. Node details and authority boundaries are available in the interactive documentation.</desc>
<defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#C23F1C"/></marker></defs>
<style>.background{fill:#F4EEE3}.node{fill:#FFFAF2;stroke:#D9D0C2;stroke-width:2}.heading,.title{font-family:Arial,sans-serif;fill:#211C18;font-weight:700}.heading{font-size:36px}.title{font-size:22px}.sub{font:16px Arial,sans-serif;fill:#6A625A}.num,.row{font:700 15px Arial,sans-serif;fill:#C23F1C}.arrow{stroke:#C23F1C;stroke-width:2.5}.arrow-label{font:12px Arial,sans-serif;fill:#6A625A}.footer{font:14px Arial,sans-serif;fill:#6A625A}</style>
<rect width="1400" height="1010" class="background"/>
<text x="32" y="66" class="heading">The desk on Canton</text>
<text x="32" y="101" class="sub">The owner sets the mandate; the operator chooses only when; the ledger checks every trade.</text>
<path d="M32 123H1368" stroke="#D9D0C2" stroke-width="2"/>
<text x="32" y="183" class="row">01 · Owner authority</text><g><rect x="32" y="200" width="308" height="152" rx="15" class="node"/><text x="52" y="227" class="num">1.1</text><text class="title" x="52" y="266">Owner seat</text><text class="sub" x="52" y="320">Names, limits, money</text></g><g><rect x="382" y="200" width="308" height="152" rx="15" class="node"/><text x="402" y="227" class="num">1.2</text><text class="title" x="402" y="266">Desk studio</text><text class="sub" x="402" y="320">Draft, practice, go live</text></g><g><rect x="732" y="200" width="308" height="152" rx="15" class="node"/><text x="752" y="227" class="num">1.3</text><text class="title" x="752" y="266">DeskOffer_Open</text><text class="sub" x="752" y="320">Creates the DeskMandate</text></g><g><rect x="1082" y="200" width="308" height="152" rx="15" class="node"/><text x="1102" y="227" class="num">1.4</text><text class="title" x="1102" y="266">Owner choices</text><text class="sub" x="1102" y="320">Unpause, withdraw, close</text></g><path d="M342 276h31" class="arrow" marker-end="url(#tip)"/><text x="355" y="379" class="arrow-label" text-anchor="middle">signed mandate</text><path d="M692 276h31" class="arrow" marker-end="url(#tip)"/><text x="705" y="379" class="arrow-label" text-anchor="middle">owner's cash</text><path d="M1042 276h31" class="arrow" marker-end="url(#tip)"/><text x="1055" y="379" class="arrow-label" text-anchor="middle">owner-only</text><text x="32" y="418" class="row">02 · Decision and checks</text><g><rect x="32" y="435" width="308" height="152" rx="15" class="node"/><text x="52" y="462" class="num">2.1</text><text class="title" x="52" y="501">DeskMarks</text><text class="sub" x="52" y="555">Oracle marks, 2 of 3</text></g><g><rect x="382" y="435" width="308" height="152" rx="15" class="node"/><text x="402" y="462" class="num">2.2</text><text class="title" x="402" y="501">Desk runner</text><text class="sub" x="402" y="555">Prices, timing, a decision</text></g><g><rect x="732" y="435" width="308" height="152" rx="15" class="node"/><text x="752" y="462" class="num">2.3</text><text class="title" x="752" y="501">Mandate_Trade</text><text class="sub" x="752" y="555">Up lots on an allowed name</text></g><g><rect x="1082" y="435" width="308" height="152" rx="15" class="node"/><text x="1102" y="462" class="num">2.4</text><text class="title" x="1102" y="501">Mandate_Sell</text><text class="sub" x="1102" y="555">Only what the desk bought</text></g><path d="M342 511h31" class="arrow" marker-end="url(#tip)"/><text x="355" y="614" class="arrow-label" text-anchor="middle">reference</text><path d="M692 511h31" class="arrow" marker-end="url(#tip)"/><text x="705" y="614" class="arrow-label" text-anchor="middle">decision hash</text><path d="M1042 511h31" class="arrow" marker-end="url(#tip)"/><text x="1055" y="614" class="arrow-label" text-anchor="middle">or sell back</text><text x="32" y="653" class="row">03 · Record and settlement</text><g><rect x="32" y="670" width="308" height="152" rx="15" class="node"/><text x="52" y="697" class="num">3.1</text><text class="title" x="52" y="736">Owner's legs</text><text class="sub" x="52" y="790">Ordinary positions</text></g><g><rect x="382" y="670" width="308" height="152" rx="15" class="node"/><text x="402" y="697" class="num">3.2</text><text class="title" x="402" y="736">DeskDecision</text><text class="sub" x="402" y="790">Hash chain, every action</text></g><g><rect x="732" y="670" width="308" height="152" rx="15" class="node"/><text x="752" y="697" class="num">3.3</text><text class="title" x="752" y="736">Daily checkpoint</text><text class="sub" x="752" y="790">Even when nothing trades</text></g><g><rect x="1082" y="670" width="308" height="152" rx="15" class="node"/><text x="1102" y="697" class="num">3.4</text><text class="title" x="1102" y="736">Desk cockpit</text><text class="sub" x="1102" y="790">Value, activity, rules</text></g><path d="M342 746h31" class="arrow" marker-end="url(#tip)"/><text x="355" y="849" class="arrow-label" text-anchor="middle">settles to seat</text><path d="M692 746h31" class="arrow" marker-end="url(#tip)"/><text x="705" y="849" class="arrow-label" text-anchor="middle">sealed record</text><path d="M1042 746h31" class="arrow" marker-end="url(#tip)"/><text x="1055" y="849" class="arrow-label" text-anchor="middle">read and compare</text>
<path d="M32 920H1368" stroke="#D9D0C2" stroke-width="2"/>
<text x="32" y="951" class="footer">Agari architecture · Source reviewed 30 September 2026 · Proven on a local Canton sandbox with demo credits; not yet on DevNet</text>
<text x="32" y="979" class="footer">Open the interactive diagram for authority and trust details.</text>
